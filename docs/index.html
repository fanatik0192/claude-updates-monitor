<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Claude Monitor | Olympus Capital</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Cormorant+Garamond:wght@300;400;500;600&family=Libre+Baskerville:wght@400;700&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Palette Hermes / Goyard luxe */
            --bg-primary: #0d0d0d;
            --bg-secondary: #141414;
            --bg-tertiary: #1a1a1a;
            --bg-card: #111111;
            --bg-elevated: #181818;

            /* Or et bronze luxueux */
            --gold-primary: #c9a962;
            --gold-light: #e4d4a5;
            --gold-dark: #8b7355;
            --gold-muted: #6b5d4d;

            /* Accents Hermes orange */
            --orange-hermes: #f37021;
            --orange-light: #ff8c42;
            --orange-muted: #c45e1a;

            /* Couleurs changelog */
            --green-added: #4ade80;
            --blue-changed: #60a5fa;
            --red-removed: #f87171;
            --yellow-fixed: #fbbf24;

            /* Textes */
            --text-primary: #f5f5f0;
            --text-secondary: #a8a8a0;
            --text-tertiary: #6b6b65;
            --text-gold: var(--gold-primary);

            /* Bordures subtiles */
            --border-subtle: rgba(201, 169, 98, 0.08);
            --border-gold: rgba(201, 169, 98, 0.2);
            --border-light: rgba(201, 169, 98, 0.12);

            /* Ombres luxueuses */
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.5);
            --shadow-gold: 0 0 60px rgba(201, 169, 98, 0.08);

            /* Transitions elegantes */
            --transition-elegant: 400ms cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --transition-smooth: 300ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 15px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.7;
        }

        /* Pattern Goyard subtil */
        .luxury-pattern {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            opacity: 0.015;
            background-image:
                repeating-linear-gradient(
                    45deg,
                    var(--gold-primary) 0,
                    var(--gold-primary) 1px,
                    transparent 1px,
                    transparent 20px
                ),
                repeating-linear-gradient(
                    -45deg,
                    var(--gold-primary) 0,
                    var(--gold-primary) 1px,
                    transparent 1px,
                    transparent 20px
                );
            pointer-events: none;
            z-index: 0;
        }

        /* Effet de lumiere doree en haut */
        .golden-glow {
            position: fixed;
            top: -200px;
            left: 50%;
            transform: translateX(-50%);
            width: 800px;
            height: 400px;
            background: radial-gradient(ellipse, rgba(201, 169, 98, 0.06) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1100px;
            margin: 0 auto;
            padding: 32px 24px;
            padding-bottom: 120px;
        }

        /* Header luxueux */
        .header {
            text-align: center;
            padding: 48px 0 40px;
            margin-bottom: 48px;
            border-bottom: 1px solid var(--border-gold);
            position: relative;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-primary), transparent);
        }

        .logo-emblem {
            width: 72px;
            height: 72px;
            margin: 0 auto 20px;
            border: 1px solid var(--border-gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            background: linear-gradient(135deg, var(--bg-card), var(--bg-elevated));
            box-shadow: var(--shadow-gold);
            position: relative;
        }

        .logo-emblem::before {
            content: '';
            position: absolute;
            inset: 4px;
            border: 1px solid var(--border-subtle);
            border-radius: 50%;
        }

        .brand-name {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            font-weight: 400;
            letter-spacing: 0.15em;
            color: var(--text-primary);
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .brand-tagline {
            font-family: 'Cormorant Garamond', serif;
            font-size: 0.95rem;
            font-weight: 400;
            letter-spacing: 0.3em;
            color: var(--gold-primary);
            text-transform: uppercase;
        }

        .last-check {
            margin-top: 24px;
            font-size: 0.75rem;
            color: var(--text-tertiary);
            letter-spacing: 0.1em;
        }

        .last-check-time {
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-secondary);
        }

        /* Bandeau derniere visite */
        .visit-banner {
            background: linear-gradient(135deg, rgba(201, 169, 98, 0.1), rgba(201, 169, 98, 0.05));
            border: 1px solid var(--border-gold);
            padding: 16px 24px;
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .visit-banner-text {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .visit-banner-highlight {
            color: var(--gold-primary);
            font-weight: 500;
        }

        .visit-banner-count {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1rem;
            color: var(--orange-hermes);
            font-weight: 600;
        }

        /* Filtres par categorie */
        .filters-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 32px;
            padding: 20px 0;
            border-bottom: 1px solid var(--border-subtle);
        }

        .filter-btn {
            font-family: 'Cormorant Garamond', serif;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 10px 20px;
            background: transparent;
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition-smooth);
        }

        .filter-btn:hover {
            border-color: var(--gold-primary);
            color: var(--gold-primary);
        }

        .filter-btn.active {
            background: var(--orange-hermes);
            border-color: var(--orange-hermes);
            color: white;
        }

        .filter-btn .count {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            margin-left: 6px;
            opacity: 0.7;
        }

        /* Status Banner elegant */
        .status-banner {
            background: var(--bg-card);
            border: 1px solid var(--border-gold);
            padding: 32px 40px;
            margin-bottom: 48px;
            position: relative;
            overflow: hidden;
        }

        .status-banner::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-primary), transparent);
        }

        .status-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .status-left {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .status-icon {
            width: 56px;
            height: 56px;
            border: 1px solid var(--border-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            position: relative;
        }

        .status-icon.alert {
            border-color: var(--orange-hermes);
            animation: pulse-gold 2.5s ease-in-out infinite;
        }

        .status-icon.success {
            border-color: var(--gold-primary);
        }

        @keyframes pulse-gold {
            0%, 100% { box-shadow: 0 0 0 0 rgba(243, 112, 33, 0.2); }
            50% { box-shadow: 0 0 0 15px rgba(243, 112, 33, 0); }
        }

        .status-text h2 {
            font-family: 'Libre Baskerville', serif;
            font-size: 1.3rem;
            font-weight: 400;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .status-text p {
            font-size: 0.85rem;
            color: var(--text-secondary);
            letter-spacing: 0.02em;
        }

        .status-metrics {
            display: flex;
            gap: 48px;
        }

        .metric {
            text-align: center;
        }

        .metric-value {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            font-weight: 400;
            color: var(--gold-primary);
            line-height: 1;
        }

        .metric-label {
            font-size: 0.65rem;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-top: 8px;
        }

        /* Timeline Section */
        .timeline-section {
            margin-bottom: 48px;
        }

        .timeline {
            position: relative;
            padding-left: 40px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 8px;
            top: 0;
            bottom: 0;
            width: 1px;
            background: linear-gradient(to bottom, var(--gold-primary), var(--border-subtle));
        }

        .timeline-item {
            position: relative;
            padding-bottom: 24px;
            padding-left: 20px;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: -36px;
            top: 6px;
            width: 10px;
            height: 10px;
            border: 2px solid var(--gold-primary);
            background: var(--bg-primary);
            border-radius: 50%;
        }

        .timeline-item.is-new::before {
            background: var(--orange-hermes);
            border-color: var(--orange-hermes);
            animation: pulse-timeline 2s ease-in-out infinite;
        }

        @keyframes pulse-timeline {
            0%, 100% { box-shadow: 0 0 0 0 rgba(243, 112, 33, 0.3); }
            50% { box-shadow: 0 0 0 8px rgba(243, 112, 33, 0); }
        }

        .timeline-date {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: var(--text-tertiary);
            margin-bottom: 4px;
        }

        .timeline-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1rem;
            color: var(--text-primary);
        }

        .timeline-source {
            font-size: 0.75rem;
            color: var(--gold-primary);
        }

        /* Section Titles */
        .section {
            margin-bottom: 48px;
        }

        .section-header {
            display: flex;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .section-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--gold-primary);
            text-transform: uppercase;
            letter-spacing: 0.2em;
        }

        .section-count {
            margin-left: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: var(--text-tertiary);
            letter-spacing: 0.05em;
        }

        /* Version Cards Grid */
        .versions-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        .version-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            padding: 24px 20px;
            text-align: center;
            transition: all var(--transition-elegant);
            position: relative;
        }

        .version-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 1px;
            background: var(--gold-primary);
            opacity: 0;
            transition: all var(--transition-elegant);
        }

        .version-card:hover {
            border-color: var(--border-gold);
            transform: translateY(-2px);
        }

        .version-card:hover::before {
            opacity: 1;
            width: 60px;
        }

        .version-card.updated {
            border-color: var(--gold-primary);
        }

        .version-card.updated::before {
            opacity: 1;
        }

        .version-icon {
            font-size: 1.5rem;
            margin-bottom: 12px;
        }

        .version-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 8px;
        }

        .version-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--gold-light);
        }

        /* Update Cards */
        .updates-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .update-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            transition: all var(--transition-elegant);
            overflow: hidden;
        }

        .update-card.hidden {
            display: none;
        }

        .update-card:hover {
            border-color: var(--border-gold);
        }

        .update-card.is-new {
            border-color: var(--orange-hermes);
            border-left-width: 2px;
        }

        .update-card.since-visit {
            background: linear-gradient(90deg, rgba(243, 112, 33, 0.05), transparent);
        }

        .update-header {
            padding: 20px 24px;
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: background var(--transition-smooth);
        }

        .update-header:hover {
            background: var(--bg-elevated);
        }

        .update-icon {
            width: 44px;
            height: 44px;
            border: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            margin-right: 20px;
            flex-shrink: 0;
        }

        .update-info {
            flex: 1;
            min-width: 0;
        }

        .update-source {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .new-tag {
            font-family: 'DM Sans', sans-serif;
            font-size: 0.6rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--orange-hermes);
            background: rgba(243, 112, 33, 0.1);
            padding: 4px 10px;
            border: 1px solid rgba(243, 112, 33, 0.3);
        }

        .category-tag {
            font-family: 'DM Sans', sans-serif;
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--gold-primary);
            background: rgba(201, 169, 98, 0.1);
            padding: 3px 8px;
            border: 1px solid rgba(201, 169, 98, 0.2);
        }

        .update-title {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .update-meta {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .update-version {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--gold-primary);
            background: var(--bg-elevated);
            padding: 6px 14px;
            border: 1px solid var(--border-subtle);
        }

        .update-expand {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-tertiary);
            font-size: 0.75rem;
            transition: all var(--transition-smooth);
        }

        .update-card.open .update-expand {
            transform: rotate(180deg);
            color: var(--gold-primary);
        }

        /* Expanded Content */
        .update-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height var(--transition-elegant);
        }

        .update-card.open .update-content {
            max-height: 800px;
        }

        .update-body {
            padding: 0 24px 24px;
            border-top: 1px solid var(--border-subtle);
        }

        .update-details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            padding: 20px 0;
            border-bottom: 1px solid var(--border-subtle);
            margin-bottom: 20px;
        }

        .detail-item {
            text-align: center;
        }

        .detail-label {
            font-size: 0.6rem;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: 6px;
        }

        .detail-value {
            font-family: 'Cormorant Garamond', serif;
            font-size: 0.95rem;
            color: var(--text-primary);
        }

        .update-description-box {
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            padding: 20px;
            margin-bottom: 16px;
        }

        .description-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 0.75rem;
            color: var(--gold-primary);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .description-text {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.7;
        }

        /* Changelog formaté */
        .changelog-box {
            background: var(--bg-elevated);
            border-left: 2px solid var(--gold-primary);
            padding: 20px;
            margin-bottom: 16px;
        }

        .changelog-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 0.75rem;
            color: var(--gold-light);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: 16px;
        }

        .changelog-items {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .changelog-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .changelog-item-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .changelog-item-icon.added {
            background: rgba(74, 222, 128, 0.15);
            color: var(--green-added);
        }

        .changelog-item-icon.fixed {
            background: rgba(251, 191, 36, 0.15);
            color: var(--yellow-fixed);
        }

        .changelog-item-icon.removed {
            background: rgba(248, 113, 113, 0.15);
            color: var(--red-removed);
        }

        .changelog-item-icon.changed {
            background: rgba(96, 165, 250, 0.15);
            color: var(--blue-changed);
        }

        .changelog-item-text {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        /* Texte EN en petit */
        .update-summary-box {
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            padding: 20px;
        }

        .summary-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 0.75rem;
            color: var(--gold-light);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: 12px;
        }

        .summary-text {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.7;
            margin-bottom: 12px;
        }

        .summary-text-en {
            font-size: 0.7rem;
            color: var(--text-tertiary);
            font-style: italic;
            line-height: 1.5;
            padding-top: 8px;
            border-top: 1px dashed var(--border-subtle);
        }

        .summary-text-en::before {
            content: 'EN: ';
            color: var(--gold-muted);
            font-style: normal;
        }

        /* Loading State */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            gap: 24px;
        }

        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 1px solid var(--border-subtle);
            border-top-color: var(--gold-primary);
            border-radius: 50%;
            animation: spin 1.2s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-family: 'Cormorant Garamond', serif;
            font-size: 0.9rem;
            color: var(--text-secondary);
            letter-spacing: 0.1em;
        }

        /* Refresh Button */
        .refresh-btn {
            position: fixed;
            bottom: 32px;
            right: 32px;
            width: 52px;
            height: 52px;
            background: var(--bg-card);
            border: 1px solid var(--gold-primary);
            color: var(--gold-primary);
            font-size: 1.1rem;
            cursor: pointer;
            transition: all var(--transition-elegant);
            z-index: 100;
        }

        .refresh-btn:hover {
            background: var(--gold-primary);
            color: var(--bg-primary);
            transform: translateY(-2px);
            box-shadow: var(--shadow-gold);
        }

        .refresh-btn.loading {
            animation: spin 1s linear infinite;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 48px 0 32px;
            border-top: 1px solid var(--border-subtle);
            position: relative;
        }

        .footer::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-primary), transparent);
        }

        .footer-brand {
            font-family: 'Playfair Display', serif;
            font-size: 0.85rem;
            color: var(--text-secondary);
            letter-spacing: 0.15em;
            margin-bottom: 8px;
        }

        .footer-text {
            font-size: 0.7rem;
            color: var(--text-tertiary);
            letter-spacing: 0.1em;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container { padding: 20px 16px; }
            .brand-name { font-size: 1.6rem; letter-spacing: 0.1em; }
            .status-content { flex-direction: column; gap: 24px; text-align: center; }
            .status-left { flex-direction: column; }
            .status-metrics { justify-content: center; gap: 32px; }
            .versions-grid { grid-template-columns: repeat(2, 1fr); }
            .update-details { grid-template-columns: 1fr; gap: 16px; }
            .update-meta { display: none; }
            .filters-bar { justify-content: center; }
            .visit-banner { flex-direction: column; gap: 12px; text-align: center; }
        }

        @media (max-width: 480px) {
            html { font-size: 14px; }
            .versions-grid { grid-template-columns: 1fr; }
            .metric-value { font-size: 1.8rem; }
            .filter-btn { padding: 8px 14px; font-size: 0.7rem; }
        }
    </style>
</head>
<body>
    <div class="luxury-pattern"></div>
    <div class="golden-glow"></div>

    <div class="container">
        <div id="app">
            <div class="loading">
                <div class="loading-spinner"></div>
                <p class="loading-text">Chargement en cours...</p>
            </div>
        </div>
    </div>

    <button class="refresh-btn" onclick="refreshData()" title="Actualiser" id="refreshBtn">
        ↻
    </button>

    <script>
        const DATA_URL = 'data.json';

        const SOURCES_CONFIG = {
            "Journal API": {
                icon: "◈",
                description: "Modifications de l'API Claude : nouveaux modeles, endpoints, parametres, limites de tokens et tarification.",
                category: "API"
            },
            "Claude Code": {
                icon: "⌘",
                description: "Assistant IA en ligne de commande permettant d'utiliser Claude directement dans votre terminal pour le developpement.",
                category: "Developpement"
            },
            "SDK Python": {
                icon: "◇",
                description: "Bibliotheque Python officielle pour integrer Claude dans vos applications. Installation via pip install anthropic.",
                category: "SDK"
            },
            "SDK TypeScript": {
                icon: "◆",
                description: "Bibliotheque TypeScript/JavaScript pour integrer Claude dans vos applications Node.js et navigateur.",
                category: "SDK"
            },
            "npm @anthropic-ai/sdk": {
                icon: "▣",
                description: "Package npm du SDK officiel Anthropic pour JavaScript et TypeScript.",
                category: "SDK"
            },
            "npm @anthropic-ai/claude-code": {
                icon: "▢",
                description: "Package npm de Claude Code - outil CLI pour developper avec Claude.",
                category: "Developpement"
            },
            "PyPI anthropic": {
                icon: "◈",
                description: "Package Python pip du SDK Anthropic. Version stable disponible sur PyPI.",
                category: "SDK"
            },
            "Blog": {
                icon: "◎",
                description: "Articles officiels d'Anthropic : annonces, cas d'usage et guides pratiques.",
                category: "Actualites"
            },
            "Recherche": {
                icon: "◉",
                description: "Publications scientifiques et travaux de recherche sur la securite et l'alignement de l'IA.",
                category: "Recherche"
            },
            "Statut": {
                icon: "◈",
                description: "Etat des services Anthropic : incidents en cours, maintenances planifiees.",
                category: "Infrastructure"
            },
            "Nouveau Depot": {
                icon: "◇",
                description: "Nouveaux projets open source publies par Anthropic sur GitHub.",
                category: "Open Source"
            }
        };

        const CATEGORIES = ['Tous', 'API', 'SDK', 'Developpement', 'Actualites', 'Recherche', 'Infrastructure', 'Open Source'];

        let tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); }

        let currentFilter = 'Tous';
        let appData = null;

        // Gestion visite utilisateur
        function getLastVisit() {
            const stored = localStorage.getItem('claude_monitor_last_visit');
            return stored ? JSON.parse(stored) : null;
        }

        function saveVisit(versions) {
            localStorage.setItem('claude_monitor_last_visit', JSON.stringify({
                date: new Date().toISOString(),
                versions: versions
            }));
        }

        function getNewSinceLastVisit(updates, lastVisit) {
            if (!lastVisit) return [];
            const lastVersions = lastVisit.versions || {};
            return updates.filter(u => {
                const config = SOURCES_CONFIG[u.source];
                if (!config) return false;
                // Compare avec les versions sauvegardees
                const savedVersion = lastVersions[u.source];
                if (!savedVersion) return true;
                return u.title !== savedVersion;
            });
        }

        async function loadData() {
            try {
                const response = await fetch(DATA_URL + '?t=' + Date.now());
                const data = await response.json();
                appData = data;
                renderApp(data);
            } catch (error) {
                console.error('Erreur:', error);
                renderError();
            }
        }

        async function refreshData() {
            const btn = document.getElementById('refreshBtn');
            btn.classList.add('loading');
            await loadData();
            setTimeout(() => btn.classList.remove('loading'), 600);
        }

        function formatDate(isoString) {
            if (!isoString) return 'Inconnu';
            const date = new Date(isoString);
            return date.toLocaleDateString('fr-FR', {
                day: '2-digit',
                month: 'long',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function formatShortDate(isoString) {
            if (!isoString) return '';
            const date = new Date(isoString);
            return date.toLocaleDateString('fr-FR', {
                day: '2-digit',
                month: 'short'
            });
        }

        function extractVersion(title) {
            const match = title?.match(/v?(\d+\.\d+\.\d+)/);
            return match ? `v${match[1]}` : title?.slice(0, 15) || '—';
        }

        function setFilter(category) {
            currentFilter = category;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.category === category);
            });
            document.querySelectorAll('.update-card').forEach(card => {
                const cardCategory = card.dataset.category;
                if (category === 'Tous' || cardCategory === category) {
                    card.classList.remove('hidden');
                } else {
                    card.classList.add('hidden');
                }
            });
        }

        function renderApp(data) {
            const app = document.getElementById('app');
            const updates = data.updates || [];
            const versions = data.versions || {};
            const lastCheck = formatDate(data.last_check);

            const newUpdates = updates.filter(u => u.is_new);
            const hasUpdates = newUpdates.length > 0;

            // Gestion derniere visite
            const lastVisit = getLastVisit();
            const newSinceVisit = lastVisit ? getNewSinceLastVisit(updates, lastVisit) : [];

            // Sauvegarde la visite actuelle
            const currentVersions = {};
            updates.forEach(u => { currentVersions[u.source] = u.title; });
            saveVisit(currentVersions);

            const latestBySource = {};
            updates.forEach(u => {
                if (!latestBySource[u.source]) latestBySource[u.source] = u;
            });

            // Compte par categorie
            const categoryCounts = {};
            CATEGORIES.forEach(c => categoryCounts[c] = 0);
            categoryCounts['Tous'] = Object.keys(latestBySource).length;
            Object.values(latestBySource).forEach(u => {
                const config = SOURCES_CONFIG[u.source];
                if (config) {
                    categoryCounts[config.category] = (categoryCounts[config.category] || 0) + 1;
                }
            });

            app.innerHTML = `
                <header class="header">
                    <div class="logo-emblem">◈</div>
                    <h1 class="brand-name">Claude Monitor</h1>
                    <p class="brand-tagline">Olympus Capital</p>
                    <p class="last-check">
                        Derniere verification : <span class="last-check-time">${lastCheck}</span>
                    </p>
                </header>

                ${lastVisit && newSinceVisit.length > 0 ? `
                    <div class="visit-banner">
                        <span class="visit-banner-text">
                            Depuis votre derniere visite le <span class="visit-banner-highlight">${formatDate(lastVisit.date)}</span>
                        </span>
                        <span class="visit-banner-count">${newSinceVisit.length} nouveau${newSinceVisit.length > 1 ? 'x' : ''}</span>
                    </div>
                ` : ''}

                <div class="filters-bar">
                    ${CATEGORIES.map(cat => `
                        <button class="filter-btn ${cat === 'Tous' ? 'active' : ''}"
                                data-category="${cat}"
                                onclick="setFilter('${cat}')">
                            ${cat}<span class="count">${categoryCounts[cat] || 0}</span>
                        </button>
                    `).join('')}
                </div>

                <div class="status-banner">
                    <div class="status-content">
                        <div class="status-left">
                            <div class="status-icon ${hasUpdates ? 'alert' : 'success'}">
                                ${hasUpdates ? '◈' : '✓'}
                            </div>
                            <div class="status-text">
                                <h2>${hasUpdates ? `${newUpdates.length} nouveaute${newUpdates.length > 1 ? 's' : ''} detectee${newUpdates.length > 1 ? 's' : ''}` : 'Systeme a jour'}</h2>
                                <p>${hasUpdates ? 'Des mises a jour sont disponibles' : 'Aucune nouvelle mise a jour detectee'}</p>
                            </div>
                        </div>
                        <div class="status-metrics">
                            <div class="metric">
                                <div class="metric-value">${Object.keys(latestBySource).length}</div>
                                <div class="metric-label">Sources</div>
                            </div>
                            <div class="metric">
                                <div class="metric-value">${newUpdates.length}</div>
                                <div class="metric-label">Nouvelles</div>
                            </div>
                        </div>
                    </div>
                </div>

                <section class="section">
                    <div class="section-header">
                        <h3 class="section-title">Versions Actuelles</h3>
                    </div>
                    <div class="versions-grid">
                        ${renderVersionCards(versions, newUpdates)}
                    </div>
                </section>

                ${hasUpdates ? `
                    <section class="section timeline-section">
                        <div class="section-header">
                            <h3 class="section-title">Timeline Recente</h3>
                        </div>
                        <div class="timeline">
                            ${newUpdates.slice(0, 5).map(u => renderTimelineItem(u)).join('')}
                        </div>
                    </section>
                ` : ''}

                ${hasUpdates ? `
                    <section class="section">
                        <div class="section-header">
                            <h3 class="section-title">Nouvelles Mises a Jour</h3>
                            <span class="section-count">${newUpdates.length} element${newUpdates.length > 1 ? 's' : ''}</span>
                        </div>
                        <div class="updates-list">
                            ${newUpdates.map((u, i) => renderUpdateCard(u, i, newSinceVisit)).join('')}
                        </div>
                    </section>
                ` : ''}

                <section class="section">
                    <div class="section-header">
                        <h3 class="section-title">Toutes les Sources</h3>
                        <span class="section-count">${Object.keys(latestBySource).length} sources</span>
                    </div>
                    <div class="updates-list">
                        ${Object.values(latestBySource).map((u, i) => renderUpdateCard(u, i, newSinceVisit)).join('')}
                    </div>
                </section>

                <footer class="footer">
                    <p class="footer-brand">◈ Olympus Capital ◈</p>
                    <p class="footer-text">Alertes critiques toutes les 15 min • Rapport quotidien a 20h</p>
                </footer>
            `;

            document.querySelectorAll('.update-header').forEach(header => {
                header.addEventListener('click', () => {
                    header.parentElement.classList.toggle('open');
                });
            });
        }

        function renderTimelineItem(update) {
            const config = SOURCES_CONFIG[update.source] || { icon: '◈' };
            return `
                <div class="timeline-item ${update.is_new ? 'is-new' : ''}">
                    <div class="timeline-date">${formatShortDate(new Date().toISOString())}</div>
                    <div class="timeline-title">${update.title.slice(0, 50)}${update.title.length > 50 ? '...' : ''}</div>
                    <div class="timeline-source">${config.icon} ${update.source}</div>
                </div>
            `;
        }

        function renderVersionCards(versions, newUpdates) {
            const items = [
                { key: 'Claude Code', icon: '⌘', name: 'Claude Code' },
                { key: 'SDK Python', icon: '◇', name: 'SDK Python' },
                { key: 'SDK TypeScript', icon: '◆', name: 'SDK TypeScript' },
                { key: 'Status API', icon: '◈', name: 'Status' }
            ];

            const newSources = new Set(newUpdates.map(u => u.source));

            return items.map(item => {
                const value = versions[item.key] || '—';
                const isUpdated = newSources.has(item.key) ||
                    (item.key === 'Claude Code' && (newSources.has('npm @anthropic-ai/claude-code') || newSources.has('Claude Code'))) ||
                    (item.key === 'SDK Python' && (newSources.has('PyPI anthropic') || newSources.has('SDK Python')));

                return `
                    <div class="version-card ${isUpdated ? 'updated' : ''}">
                        <div class="version-icon">${item.icon}</div>
                        <div class="version-name">${item.name}</div>
                        <div class="version-value">${value}</div>
                    </div>
                `;
            }).join('');
        }

        function renderUpdateCard(update, index, newSinceVisit = []) {
            const config = SOURCES_CONFIG[update.source] || {
                icon: '◈',
                description: 'Source de mise a jour Anthropic',
                category: 'Autre'
            };

            const version = extractVersion(update.title);
            const summary = update.summary || update.title || 'Aucun detail disponible';
            const summaryEn = update.summary_en || '';
            const changelogItems = update.changelog_items || [];
            const isSinceVisit = newSinceVisit.some(u => u.source === update.source && u.title === update.title);

            return `
                <div class="update-card ${update.is_new ? 'is-new' : ''} ${isSinceVisit ? 'since-visit' : ''}"
                     data-category="${config.category}">
                    <div class="update-header">
                        <div class="update-icon">${config.icon}</div>
                        <div class="update-info">
                            <div class="update-source">
                                ${update.source}
                                ${update.is_new ? '<span class="new-tag">Nouveau</span>' : ''}
                                <span class="category-tag">${config.category}</span>
                            </div>
                            <div class="update-title">${update.title}</div>
                        </div>
                        <div class="update-meta">
                            <span class="update-version">${version}</span>
                            <div class="update-expand">▼</div>
                        </div>
                    </div>
                    <div class="update-content">
                        <div class="update-body">
                            <div class="update-details">
                                <div class="detail-item">
                                    <div class="detail-label">Categorie</div>
                                    <div class="detail-value">${config.category}</div>
                                </div>
                                <div class="detail-item">
                                    <div class="detail-label">Source</div>
                                    <div class="detail-value">${update.source}</div>
                                </div>
                                <div class="detail-item">
                                    <div class="detail-label">Version</div>
                                    <div class="detail-value">${version}</div>
                                </div>
                            </div>

                            <div class="update-description-box">
                                <div class="description-title">◈ A propos</div>
                                <p class="description-text">${config.description}</p>
                            </div>

                            ${changelogItems.length > 0 ? `
                                <div class="changelog-box">
                                    <div class="changelog-title">Changelog</div>
                                    <div class="changelog-items">
                                        ${changelogItems.map(item => `
                                            <div class="changelog-item">
                                                <div class="changelog-item-icon ${item.type}">
                                                    ${item.type === 'added' ? '✚' :
                                                      item.type === 'fixed' ? '🔧' :
                                                      item.type === 'removed' ? '✖' : '↻'}
                                                </div>
                                                <div class="changelog-item-text">${item.text}</div>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                            ` : ''}

                            <div class="update-summary-box">
                                <div class="summary-title">Details de la mise a jour</div>
                                <p class="summary-text">${summary}</p>
                                ${summaryEn && summaryEn !== summary ? `
                                    <p class="summary-text-en">${summaryEn}</p>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderError() {
            document.getElementById('app').innerHTML = `
                <div class="loading">
                    <p class="loading-text">Impossible de charger les donnees</p>
                </div>
            `;
        }

        loadData();
    </script>
</body>
</html>
