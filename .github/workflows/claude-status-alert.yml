name: Claude Status Alert (Incidents Critiques)

on:
  # Execution toutes les 15 minutes pour detecter les incidents rapidement
  schedule:
    - cron: '*/15 * * * *'

  # Permet de lancer manuellement
  workflow_dispatch:

jobs:
  check-status:
    runs-on: ubuntu-latest

    steps:
      - name: Check Anthropic Status
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 << 'EOF'
          import requests
          import os
          from datetime import datetime

          TELEGRAM_BOT_TOKEN = os.environ.get("TELEGRAM_BOT_TOKEN")
          TELEGRAM_CHAT_IDS = [
              os.environ.get("TELEGRAM_CHAT_ID"),
              "1707849259"
          ]

          def send_telegram(message):
              if not TELEGRAM_BOT_TOKEN:
                  print(f"[TELEGRAM DESACTIVE] {message[:100]}...")
                  return False

              url = f"https://api.telegram.org/bot{TELEGRAM_BOT_TOKEN}/sendMessage"
              success = False

              for chat_id in TELEGRAM_CHAT_IDS:
                  if not chat_id:
                      continue
                  payload = {
                      "chat_id": chat_id,
                      "text": message,
                      "parse_mode": "HTML",
                      "disable_web_page_preview": True
                  }
                  try:
                      response = requests.post(url, json=payload, timeout=10)
                      if response.status_code == 200:
                          print(f"[TELEGRAM] Alerte envoyee a {chat_id}")
                          success = True
                      else:
                          print(f"[ERREUR] {chat_id}: {response.status_code}")
                  except Exception as e:
                      print(f"[ERREUR] {chat_id}: {e}")

              return success

          def check_status():
              try:
                  response = requests.get("https://status.anthropic.com", timeout=15)
                  text = response.text.lower()

                  # Mots-cles indiquant un incident actif
                  critical_keywords = ["outage", "degraded", "incident", "investigating", "identified"]
                  maintenance_keywords = ["maintenance", "scheduled"]

                  is_critical = any(word in text for word in critical_keywords)
                  is_maintenance = any(word in text for word in maintenance_keywords)

                  if is_critical:
                      now = datetime.now()
                      msg = f"""
          ⚠️ <b>ALERTE CRITIQUE - ANTHROPIC</b>
          📅 {now.strftime('%d/%m/%Y')} • {now.strftime('%H:%M')}

          🔴 <b>Incident detecte sur les services Claude</b>

          Un probleme est en cours sur l'infrastructure Anthropic.
          Cela peut affecter l'API Claude et Claude Code.

          🔗 <a href="https://status.anthropic.com">Voir le statut en direct</a>

          ━━━━━━━━━━━━━━━━━━━━
          ⏰ Prochaine verification dans 15 min
          """
                      send_telegram(msg)
                      print("[ALERTE] Incident critique detecte - Notification envoyee")
                      return True

                  elif is_maintenance:
                      print("[INFO] Maintenance en cours - Pas d'alerte critique")
                      return False

                  else:
                      print("[OK] Aucun incident detecte")
                      return False

              except Exception as e:
                  print(f"[ERREUR] Impossible de verifier le statut: {e}")
                  return False

          if __name__ == "__main__":
              check_status()
          EOF
